{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | DHH</title>
    <link rel="stylesheet" href="{% static 'DeveloperHieringHub/design-system.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .error-container {
            text-align: center;
            padding: 60px 20px;
            position: relative;
            z-index: 2;
        }

        /* GLITCH 404 */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 40px;
        }

        .glitch {
            font-size: clamp(6rem, 20vw, 15rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            position: relative;
            color: var(--teal-light);
            text-shadow: 0 0 30px rgba(0, 128, 128, 0.5);
            animation: glitchSkew 3s infinite linear alternate-reverse;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            color: #ff00ff;
            animation: glitchNoise1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
            transform: translate(-3px, -2px);
            opacity: 0.8;
        }

        .glitch::after {
            color: #00ffff;
            animation: glitchNoise2 3s infinite linear alternate-reverse;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
            transform: translate(3px, 2px);
            opacity: 0.8;
        }

        @keyframes glitchNoise1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
        }

        @keyframes glitchNoise2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(3px, -3px); }
            40% { transform: translate(3px, 3px); }
            60% { transform: translate(-3px, -3px); }
            80% { transform: translate(-3px, 3px); }
        }

        @keyframes glitchSkew {
            0%, 100% { transform: skew(0deg); }
            25% { transform: skew(2deg); }
            50% { transform: skew(-2deg); }
            75% { transform: skew(1deg); }
        }

        /* PAGE TITLE */
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--color-white);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .error-description {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--color-gray-5);
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        /* ACTION BUTTONS */
        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-error-primary {
            padding: 16px 32px;
            background: linear-gradient(135deg, #008080, #00cccc);
            color: black;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 30px rgba(0, 128, 128, 0.4);
        }

        .btn-error-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 50px rgba(0, 128, 128, 0.7);
            color: black;
        }

        .btn-error-secondary {
            padding: 16px 32px;
            background: transparent;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-error-secondary:hover {
            border-color: var(--teal-primary);
            background: rgba(0, 128, 128, 0.1);
            color: var(--teal-light);
            box-shadow: 0 0 30px rgba(0, 128, 128, 0.3);
        }

        /* FLOATING PARTICLES */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(0, 200, 200, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 128, 128, 0.6);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* BACKGROUND GRID */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 128, 128, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 128, 128, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* GRADIENT ORBS */
        .gradient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            animation: floatOrb 10s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 128, 128, 0.4), transparent 70%);
            top: -200px;
            right: -200px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 200, 200, 0.3), transparent 70%);
            bottom: -150px;
            left: -150px;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 30px) scale(0.9);
            }
        }

        /* CODE BLOCK DECORATION */
        .code-decoration {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: rgba(0, 128, 128, 0.5);
            text-align: center;
        }

        .code-decoration pre {
            margin: 0;
            padding: 20px;
            background: rgba(0, 128, 128, 0.05);
            border: 1px solid rgba(0, 128, 128, 0.1);
            border-radius: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .error-actions {
                flex-direction: column;
                align-items: center;
            }

            .btn-error-primary,
            .btn-error-secondary {
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }

            .code-decoration {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="grid-background"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="particles" id="particles"></div>

    <!-- Error Container -->
    <div class="error-container">
        <!-- Glitch 404 -->
        <div class="glitch-wrapper">
            <div class="glitch" data-text="404">404</div>
        </div>

        <!-- Title -->
        <h1 class="error-title">Page Not Found</h1>

        <!-- Description -->
        <p class="error-description">
            The page you're looking for doesn't exist or has been moved. 
            Let's get you back on track.
        </p>

        <!-- Action Buttons -->
        <div class="error-actions">
            <a href="/" class="btn-error-primary">
                <i class="fas fa-home"></i>
                Return Home
            </a>
            <a href="/dashboard.html" class="btn-error-secondary">
                <i class="fas fa-th-large"></i>
                Open Dashboard
            </a>
        </div>
    </div>

    <!-- Code Decoration -->
    <div class="code-decoration">
        <pre>{
  "error": "NOT_FOUND",
  "status": 404,
  "message": "The requested resource could not be found"
}</pre>
    </div>

    <script>
        // Generate floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const left = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = 5 + Math.random() * 10;
                const size = 2 + Math.random() * 3;
                
                particle.style.left = `${left}%`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
        });
    </script>
</body>
</html>
